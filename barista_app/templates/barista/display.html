<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6f4e37 0%, #3d2817 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .display-container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
        }

        .coffee-icon {
            font-size: 8rem;
            margin-bottom: 2rem;
            animation: steam 2s ease-in-out infinite;
        }

        @keyframes steam {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-text {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .time-display {
            font-size: 4rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .robot-status {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border-radius: 3rem;
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }

        .robot-status.connected {
            background: rgba(40, 167, 69, 0.3);
            border: 2px solid #28a745;
        }

        .robot-status.disconnected {
            background: rgba(220, 53, 69, 0.3);
            border: 2px solid #dc3545;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .connected .status-dot { background: #28a745; }
        .disconnected .status-dot { background: #dc3545; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Warnings Section */
        .warnings-section {
            margin-top: 2rem;
        }

        .warning-card {
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid #ffc107;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: warning-pulse 1.5s infinite;
        }

        .warning-card.critical {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
        }

        @keyframes warning-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .warning-icon {
            font-size: 2rem;
        }

        .warning-text {
            font-size: 1.25rem;
            font-weight: 500;
        }

        /* Touch Prompt */
        .touch-prompt {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.6;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .touch-prompt:hover {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .coffee-icon { font-size: 5rem; }
            .status-text { font-size: 2rem; }
            .time-display { font-size: 2.5rem; }
        }
    </style>
</head>
<body onclick="goToLogin()">
    <div class="display-container">
        <div class="coffee-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>

        <div class="status-text">System Operating</div>

        <div class="time-display" id="current-time">--:--:--</div>

        <div class="robot-status {% if robot_connected %}connected{% else %}disconnected{% endif %}">
            <span class="status-dot"></span>
            <span>Robot {% if robot_connected %}Connected{% else %}Disconnected{% endif %}</span>
        </div>

        {% if warnings %}
        <div class="warnings-section">
            {% for warning in warnings %}
            <div class="warning-card {% if warning.severity == 'critical' %}critical{% endif %}">
                <div class="warning-icon">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <div class="warning-text">
                    {{ warning.name }} Low ({{ warning.level|floatformat:0 }}%)
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <div class="touch-prompt">
        <i class="bi bi-hand-index"></i> Touch to Configure
    </div>

    <script>
        // Update time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('current-time').textContent = timeStr;
        }

        updateTime();
        setInterval(updateTime, 1000);

        // Go to login on click
        function goToLogin() {
            window.location.href = '{% url "login" %}';
        }

        // Auto-refresh every 30 seconds
        setTimeout(() => window.location.reload(), 30000);
    </script>
</body>
</html>
