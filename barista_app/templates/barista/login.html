<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barista Robot Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6f4e37 0%, #3d2817 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 4rem;
            color: #6f4e37;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            border: 2px solid #e9ecef;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #6f4e37;
            box-shadow: 0 0 0 0.2rem rgba(111, 78, 55, 0.15);
        }

        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
            border-radius: 0.75rem 0 0 0.75rem;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 0.75rem 0.75rem 0;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            background: #6f4e37;
            border: none;
            color: white;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #5a3d2b;
            transform: translateY(-2px);
        }

        .btn-back {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.75rem;
            background: transparent;
            border: 2px solid #e9ecef;
            color: #6c757d;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #f8f9fa;
            border-color: #6f4e37;
            color: #6f4e37;
        }

        .alert {
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        /* Virtual Keyboard */
        .keyboard-container {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #f8f9fa;
            padding: 1rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        .keyboard-container.show {
            display: block;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .key {
            min-width: 2.5rem;
            height: 2.5rem;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
        }

        .key:hover {
            background: #e9ecef;
        }

        .key:active {
            background: #6f4e37;
            color: white;
        }

        .key.wide {
            min-width: 5rem;
            font-size: 0.75rem;
        }

        .key.space {
            min-width: 12rem;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-logo {
                font-size: 3rem;
            }

            .key {
                min-width: 2rem;
                height: 2.25rem;
                font-size: 0.875rem;
            }

            .key.wide {
                min-width: 3.5rem;
            }

            .key.space {
                min-width: 8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="bi bi-cup-hot-fill"></i>
            </div>
            <h1 class="login-title">Barista Control</h1>
            <p class="login-subtitle">Sign in to access the control panel</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Enter your username" required
                           onfocus="showKeyboard(this)" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required
                           onfocus="showKeyboard(this)" autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>

            <a href="{% url 'barista-display' %}" class="btn btn-back">
                <i class="bi bi-arrow-left me-2"></i>
                Back to Display
            </a>
        </form>
    </div>

    <!-- Virtual Keyboard -->
    <div class="keyboard-container" id="keyboard">
        <div class="keyboard-row">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
            <button class="key wide" data-key="backspace"><i class="bi bi-backspace"></i></button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="q">q</button>
            <button class="key" data-key="w">w</button>
            <button class="key" data-key="e">e</button>
            <button class="key" data-key="r">r</button>
            <button class="key" data-key="t">t</button>
            <button class="key" data-key="y">y</button>
            <button class="key" data-key="u">u</button>
            <button class="key" data-key="i">i</button>
            <button class="key" data-key="o">o</button>
            <button class="key" data-key="p">p</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="a">a</button>
            <button class="key" data-key="s">s</button>
            <button class="key" data-key="d">d</button>
            <button class="key" data-key="f">f</button>
            <button class="key" data-key="g">g</button>
            <button class="key" data-key="h">h</button>
            <button class="key" data-key="j">j</button>
            <button class="key" data-key="k">k</button>
            <button class="key" data-key="l">l</button>
        </div>
        <div class="keyboard-row">
            <button class="key wide" data-key="shift">Shift</button>
            <button class="key" data-key="z">z</button>
            <button class="key" data-key="x">x</button>
            <button class="key" data-key="c">c</button>
            <button class="key" data-key="v">v</button>
            <button class="key" data-key="b">b</button>
            <button class="key" data-key="n">n</button>
            <button class="key" data-key="m">m</button>
            <button class="key wide" data-key="hide">Done</button>
        </div>
        <div class="keyboard-row">
            <button class="key space" data-key=" ">Space</button>
        </div>
    </div>

    <script>
        let activeInput = null;
        let shiftActive = false;

        function showKeyboard(input) {
            activeInput = input;
            document.getElementById('keyboard').classList.add('show');
        }

        function hideKeyboard() {
            document.getElementById('keyboard').classList.remove('show');
            activeInput = null;
        }

        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function(e) {
                e.preventDefault();
                if (!activeInput) return;

                const keyValue = this.dataset.key;

                if (keyValue === 'backspace') {
                    activeInput.value = activeInput.value.slice(0, -1);
                } else if (keyValue === 'shift') {
                    shiftActive = !shiftActive;
                    this.classList.toggle('active', shiftActive);
                } else if (keyValue === 'hide') {
                    hideKeyboard();
                } else {
                    let char = keyValue;
                    if (shiftActive && char.length === 1) {
                        char = char.toUpperCase();
                        shiftActive = false;
                        document.querySelector('[data-key="shift"]').classList.remove('active');
                    }
                    activeInput.value += char;
                }

                activeInput.focus();
            });
        });

        // Hide keyboard when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.keyboard-container') &&
                !e.target.closest('input') &&
                activeInput) {
                hideKeyboard();
            }
        });
    </script>
</body>
</html>
